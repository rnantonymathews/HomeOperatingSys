<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HomeOS - tvOS Launcher</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#06080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">

  <link rel="stylesheet" href="css/tvos-core.css">
  <link rel="stylesheet" href="css/launcher.css">
</head>
<body>
  <div id="app" class="tv-viewport">
    <!-- Blue Circle Remote Cursor -->
    <div id="tv-cursor"></div>

    <!-- 6-Digit Code Badge at Bottom Right -->
    <div id="tv-pairing-badge">
      <div id="tv-pairing-dot" class="pairing-dot"></div>
      <span class="pairing-label">Pair Remote</span>
      <span id="tv-pairing-code" class="pairing-code">--- · ---</span>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
