<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeOS & HomeMote - Dev Testing Studio</title>
  <style>
    :root {
      --bg: #090b10;
      --card-bg: #141720;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #0071e3;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20, 23, 32, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0071e3, #4facfe);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header-links {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #0077ed;
    }

    /* Main Studio Split Layout */
    .studio-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 65px);
      overflow: hidden;
      padding: 16px;
      gap: 16px;
    }

    .viewport-tv {
      flex: 1;
      background: #000;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .viewport-remote {
      width: 390px;
      background: #0b0c0e;
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .pane-header {
      padding: 10px 18px;
      background: #141720;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pane-header span.badge {
      background: rgba(0, 113, 227, 0.2);
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    @media (max-width: 900px) {
      .studio-container {
        flex-direction: column;
        height: auto;
      }
      .viewport-remote {
        width: 100%;
        height: 600px;
      }
      .viewport-tv {
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"></div>
      <h1>HomeOS & HomeMote Live Studio</h1>
    </div>

    <div class="header-links">
      <a href="./HomeOS/" target="_blank" class="btn">📺 Open HomeOS (New Tab)</a>
      <a href="./HomeMote/" target="_blank" class="btn">📱 Open HomeMote (New Tab)</a>
      <a href="https://github.com/rnantonymathews/HomeOperatingSys.git" target="_blank" class="btn">🐙 GitHub Repo</a>
    </div>
  </header>

  <main class="studio-container">
    <!-- Left: TV Launcher -->
    <section class="viewport-tv">
      <div class="pane-header">
        <span>HomeOS — tvOS Launcher (10-Foot UI)</span>
        <span class="badge">16:9 Landscape PWA</span>
      </div>
      <iframe src="./HomeOS/" title="HomeOS TV Launcher"></iframe>
    </section>

    <!-- Right: Mobile Remote Controller -->
    <section class="viewport-remote">
      <div class="pane-header">
        <span>HomeMote — Siri Remote</span>
        <span class="badge">Portrait PWA</span>
      </div>
      <iframe src="./HomeMote/" title="HomeMote Remote Controller"></iframe>
    </section>
  </main>

</body>
</html>
