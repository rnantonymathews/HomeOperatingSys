<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HomeMote - tvOS Remote</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16191f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">

  <link rel="stylesheet" href="css/mote-core.css">
  <link rel="stylesheet" href="css/remote.css">
</head>
<body>
  <div id="remote" class="remote-wrapper">

    <!-- Screen 1: Connect to your TV (6-Digit PIN Entry) -->
    <div id="pairing-screen" class="remote-screen">
      <div class="pairing-header">
        <div class="pairing-icon"></div>
        <h1 class="pairing-title">Connect to your TV</h1>
        <p class="pairing-subtitle">Enter the 6-digit code to pair with HomeOS</p>
      </div>

      <!-- 6-Box PIN Display -->
      <div id="pin-display" class="pin-box-row">
        <div class="pin-box active" data-index="0"></div>
        <div class="pin-box" data-index="1"></div>
        <div class="pin-box" data-index="2"></div>
        <div class="pin-spacer">·</div>
        <div class="pin-box" data-index="3"></div>
        <div class="pin-box" data-index="4"></div>
        <div class="pin-box" data-index="5"></div>
      </div>

      <div id="pairing-feedback" class="pairing-feedback"></div>

      <!-- Tactile Number Pad -->
      <div class="numpad-grid">
        <button class="numpad-key" data-key="1">1</button>
        <button class="numpad-key" data-key="2">2</button>
        <button class="numpad-key" data-key="3">3</button>
        <button class="numpad-key" data-key="4">4</button>
        <button class="numpad-key" data-key="5">5</button>
        <button class="numpad-key" data-key="6">6</button>
        <button class="numpad-key" data-key="7">7</button>
        <button class="numpad-key" data-key="8">8</button>
        <button class="numpad-key" data-key="9">9</button>
        <div class="numpad-key empty"></div>
        <button class="numpad-key" data-key="0">0</button>
        <button class="numpad-key backspace" data-key="backspace">⌫</button>
      </div>
    </div>

    <!-- Screen 2: Name Setup -->
    <div id="name-screen" class="remote-screen hidden">
      <div class="name-header">
        <h1 class="name-title">What's your name?</h1>
        <p class="name-subtitle">Personalize your HomeMote controller</p>
      </div>

      <form id="name-form" class="name-form" onsubmit="return false;">
        <div class="input-wrapper">
          <input type="text" id="username-input" class="name-input" placeholder="e.g. Aaron Antony" autocomplete="name" maxlength="30" />
        </div>
        <div id="name-error" class="pairing-feedback"></div>
        <button type="submit" id="btn-save-name" class="btn-primary-action">Continue</button>
      </form>
    </div>

    <!-- Screen 3: Single Power Button in the Center -->
    <div id="power-screen" class="remote-screen hidden">
      <header class="remote-top-bar">
        <div class="tv-status-badge">
          <span class="status-dot green"></span>
          <span id="connected-user-name">HomeMote</span>
        </div>
        <button id="btn-unpair" class="btn-disconnect" title="Disconnect / Unpair">Disconnect</button>
      </header>

      <main class="power-center-container">
        <button id="btn-power-main" class="main-power-btn" title="Toggle HomeOS Power">
          <svg class="power-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
            <line x1="12" y1="2" x2="12" y2="12" />
          </svg>
        </button>
      </main>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
