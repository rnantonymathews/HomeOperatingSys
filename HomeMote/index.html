<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HomeMote - tvOS Remote</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16191f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeMote">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/mote-core.css">
  <link rel="stylesheet" href="css/remote.css">
</head>

<body>

  <!-- Remote Chassis Body -->
  <div class="remote-wrapper">

    <!-- Top Header & Status -->
    <header class="remote-header">
      <div class="header-left">
        <div id="connection-status-pill" class="status-pill disconnected">
          <span class="status-dot"></span>
          <span id="connection-status-text">Disconnected</span>
        </div>
        <div id="tv-active-app" class="tv-active-app">Home Screen</div>
      </div>

      <div class="header-right">
        <button id="pwa-remote-install" class="room-pill hidden">⬇ Install</button>
        <button id="remote-room-pill" class="room-pill" title="Click to change Room PIN">
          <span id="remote-room-text">Room: default</span>
        </button>
        <button id="btn-power" class="remote-btn btn-power" title="Sleep / Wake HomeOS">
          ⏻
        </button>
      </div>
    </header>

    <!-- Apple TV Touch Surface / Clickpad -->
    <section class="touchpad-section">
      <div id="touchpad-surface" class="clickpad-ring">
        <div class="clickpad-direction dir-up" data-direction="UP">▲</div>
        <div class="clickpad-direction dir-down" data-direction="DOWN">▼</div>
        <div class="clickpad-direction dir-left" data-direction="LEFT">◀</div>
        <div class="clickpad-direction dir-right" data-direction="RIGHT">▶</div>

        <button class="clickpad-center" title="Select">
          CLICK
        </button>
      </div>
    </section>

    <!-- Buttons Array -->
    <section class="button-grid">

      <!-- Middle Row: Back, TV/Home, Play/Pause -->
      <div class="button-row">
        <button id="btn-back" class="remote-btn btn-large" title="Back / Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>

        <button id="btn-home" class="remote-btn btn-large" title="TV / Home">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <rect x="2" y="7" width="20" height="13" rx="2" />
            <path d="M17 2l-5 5-5-5" />
          </svg>
        </button>

        <button id="btn-play-pause" class="remote-btn btn-large" title="Play / Pause">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z" />
            <rect x="18" y="5" width="3" height="14" rx="1" />
          </svg>
        </button>
      </div>

      <!-- Controls Row: Mute, Siri, Keyboard, Volume Rocker -->
      <div class="button-row">
        <button id="btn-mute" class="remote-btn btn-medium" title="Mute">
          🔇
        </button>

        <!-- Siri Voice Dictation -->
        <button id="btn-siri" class="remote-btn btn-large btn-siri" title="Press to speak with Siri">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </button>

        <button id="btn-keyboard-toggle" class="remote-btn btn-medium" title="Open Mobile Keyboard">
          ⌨️
        </button>

        <!-- Vertical Volume Rocker -->
        <div class="volume-rocker">
          <button id="btn-vol-up" class="btn-rocker" title="Volume Up">+</button>
          <div class="rocker-divider"></div>
          <button id="btn-vol-down" class="btn-rocker" title="Volume Down">-</button>
        </div>
      </div>

    </section>

    <!-- Slide-Up Mobile Keyboard Sheet -->
    <div id="keyboard-sheet" class="keyboard-sheet hidden">
      <div class="keyboard-sheet-header">
        <span>Type to HomeOS TV</span>
        <button id="btn-keyboard-done" class="btn-sheet">Done</button>
      </div>
      <div class="keyboard-input-wrap">
        <input type="text" id="remote-keyboard-input" class="keyboard-input" placeholder="Search movies, apps..."
          autocomplete="off">
        <button id="btn-keyboard-clear" class="btn-sheet">Clear</button>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="remote-toast">Message</div>

  </div>

  <!-- Main Remote Script -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
